# =============================================================
# Role + RoleBinding — Sujeto tipo ServiceAccount
# -------------------------------------------------------------
# Módulo 6 · Sesión 6
#
# El caso más común en producción: una aplicación que corre
# dentro del clúster y necesita llamar al API Server.
#
# EJEMPLOS REALES:
#   - Argo CD lee Deployments y Services para sincronizarlos
#   - Prometheus lee métricas de todos los Pods
#   - Un operador crea y elimina recursos automáticamente
#
# LA DIFERENCIA CON User y Group:
# El ServiceAccount tiene un token real montado en el Pod.
# La aplicación usa ese token para autenticarse, sin que ninguna
# persona tenga que intervenir. Es autenticación máquina a máquina.
# =============================================================

# 1. El ServiceAccount (la identidad de la app)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-monitor
  namespace: equipo-a

---
# 2. El Role (qué puede hacer)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitor-app
  namespace: equipo-a
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]

---
# 3. El RoleBinding (quién tiene el Role)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sa-monitor-binding
  namespace: equipo-a
subjects:
- kind: ServiceAccount
  name: sa-monitor
  namespace: equipo-a           # namespace donde vive el SA
roleRef:
  kind: Role
  name: monitor-app
  apiGroup: rbac.authorization.k8s.io

# -------------------------------------------------------------
# CÓMO PROBARLO — FORMA 1: auth can-i con impersonación
# -------------------------------------------------------------
# kubectl apply -f 03-role-serviceaccount.yaml
#
# La sintaxis para impersonar un SA es diferente a la de User:
# system:serviceaccount:<namespace>:<nombre>
#
# ✅ El SA puede listar Pods en su namespace
#   kubectl auth can-i list pods \
#     --as=system:serviceaccount:equipo-a:sa-monitor \
#     -n equipo-a
#
# ✅ El SA puede ver Deployments
#   kubectl auth can-i list deployments \
#     --as=system:serviceaccount:equipo-a:sa-monitor \
#     -n equipo-a
#
# ❌ El SA NO puede ver Secrets
#   kubectl auth can-i get secrets \
#     --as=system:serviceaccount:equipo-a:sa-monitor \
#     -n equipo-a
#
# ❌ El SA NO puede hacer nada en equipo-b
#   kubectl auth can-i list pods \
#     --as=system:serviceaccount:equipo-a:sa-monitor \
#     -n equipo-b
#
# -------------------------------------------------------------
# CÓMO PROBARLO — FORMA 2: Pod real que llama al API Server
# -------------------------------------------------------------
# Esta forma demuestra el mecanismo real: el token montado.
#
# Despliegue un Pod que use el SA:
#   kubectl run probador \
#     --image=curlimages/curl:latest \
#     --serviceaccount=sa-monitor \
#     --command -n equipo-a \
#     -- sleep 3600
#
# Entre al Pod:
#   kubectl exec -it probador -n equipo-a -- sh
#
# Dentro del Pod, el token está en esta ruta:
#   ls /var/run/secrets/kubernetes.io/serviceaccount/
#   # verá: ca.crt  namespace  token
#
# Usarlo para llamar al API Server:
#   TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
#   API=https://kubernetes.default.svc
#
#   # ✅ Listar Pods — tiene permiso
#   curl -sk -H "Authorization: Bearer $TOKEN" \
#     $API/api/v1/namespaces/equipo-a/pods \
#     | grep '"name"'
#
#   # ❌ Listar Secrets — devuelve 403 Forbidden
#   curl -sk -H "Authorization: Bearer $TOKEN" \
#     $API/api/v1/namespaces/equipo-a/secrets
#
# -------------------------------------------------------------
# EL PUNTO DE ESTE EJEMPLO
# -------------------------------------------------------------
# Cuando el grupo ve la llamada HTTP devolver Forbidden, entiende
# que el RBAC no es configuración abstracta: es un filtro real
# en el API Server que evalúa cada petición, venga de kubectl,
# de Argo CD o de un curl dentro de un contenedor.
# -------------------------------------------------------------
