# =============================================================
# Secret — Datos sensibles
# -------------------------------------------------------------
# Módulo 6 · visto de forma anticipada en la Sesión 4
#
# Llegamos a los Secrets por la puerta lateral: para entrar a
# Argo CD hubo que leer el secreto argocd-initial-admin-secret.
#
# stringData vs data:
#   stringData → se escribe en texto plano y Kubernetes lo
#                codifica solo. El YAML queda legible en Git.
#   data       → hay que codificarlo en base64 a mano.
#
# ADVERTENCIA FUNDAMENTAL
# base64 NO es cifrado, solo codificación. Cualquiera con
# permisos de lectura sobre el namespace puede decodificarlo.
# Para Secrets reales en Git se usan Sealed Secrets o
# External Secrets Operator.
# =============================================================
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
type: Opaque
stringData:
  MENSAJE: "Hola equipo de Redes, prueba en tiempo real"
  db-password: "S3cr3t0-D3-Pru3ba"

# -------------------------------------------------------------
# CÓMO VERLO
# -------------------------------------------------------------
# kubectl apply -f 01-secret.yaml
#
# # Listar: Kubernetes NO muestra los valores
# kubectl get secret demo-secret
#
# # Verlo codificado
# kubectl get secret demo-secret -o yaml
#
# # Decodificar una clave (multiplataforma: sirve en Windows)
# kubectl get secret demo-secret \
#   -o go-template="{{.data.MENSAJE | base64decode}}"
#
# EN ARGO CD aparecerá con los valores ocultos como ***.
# No es un error: es deliberado. Pero el dato sí es visible
# con kubectl o con Lens, lo que demuestra que ocultarlo en
# una interfaz no es lo mismo que protegerlo.
# -------------------------------------------------------------
