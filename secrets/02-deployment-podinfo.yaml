# =============================================================
# Consumir un Secret: las DOS formas, en el mismo Pod
# -------------------------------------------------------------
# Módulo 6 · visto de forma anticipada en la Sesión 4
#
# 1) Como VARIABLE DE ENTORNO (secretKeyRef)
#    podinfo imprime PODINFO_UI_MESSAGE en grande en su página
#    de inicio, así que el secreto se ve en el navegador.
#
# 2) Como ARCHIVO MONTADO (volumen de tipo secret)
#    Cada clave del Secret se convierte en un archivo dentro
#    de /etc/secretos.
#
# LA DIFERENCIA QUE CASI NADIE EXPLICA:
#   Las variables de entorno se inyectan UNA SOLA VEZ, al crear
#   el Pod. Si cambia el Secret, hay que reiniciar el Pod.
#   Los archivos montados SÍ se actualizan solos, con un
#   retraso de aproximadamente un minuto.
#
# Requiere haber aplicado antes 01-secret.yaml
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-secretos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-secretos
  template:
    metadata:
      labels:
        app: demo-secretos
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - containerPort: 9898

          # FORMA 1: variable de entorno
          env:
            - name: PODINFO_UI_MESSAGE
              valueFrom:
                secretKeyRef:
                  name: demo-secret
                  key: MENSAJE

          # FORMA 2: archivos montados
          volumeMounts:
            - name: credenciales
              mountPath: /etc/secretos
              readOnly: true

      volumes:
        - name: credenciales
          secret:
            secretName: demo-secret

# -------------------------------------------------------------
# CÓMO PROBARLO
# -------------------------------------------------------------
# kubectl apply -f 01-secret.yaml
# kubectl apply -f 02-deployment-podinfo.yaml
#
# # El Secret como ARCHIVOS: una clave = un archivo
# kubectl exec deploy/demo-secretos -- ls -la /etc/secretos
# kubectl exec deploy/demo-secretos -- cat /etc/secretos/db-password
#
# # El Secret como VARIABLE
# kubectl exec deploy/demo-secretos -- printenv PODINFO_UI_MESSAGE
#
# LA DEMOSTRACIÓN DE LA DIFERENCIA
# 1. Cambie el valor de MENSAJE en 01-secret.yaml y aplique
# 2. El ARCHIVO se actualiza solo (espere ~60 s):
#      kubectl exec deploy/demo-secretos -- cat /etc/secretos/MENSAJE
# 3. La VARIABLE no cambia, y la página web sigue igual
# 4. Hay que reiniciar para que la tome:
#      kubectl rollout restart deploy/demo-secretos
# -------------------------------------------------------------
