# =============================================================
# Service para ver el Secret en el navegador
# -------------------------------------------------------------
# Módulo 6 · visto de forma anticipada en la Sesión 4
#
# Fíjese en el mapeo de puertos, que es el concepto del
# Módulo 4 en funcionamiento:
#   port       80   → por donde entra el navegador
#   targetPort 9898 → donde escucha realmente podinfo
#
# ATENCIÓN: en DigitalOcean esto aprovisiona un Load Balancer
# que se factura por hora. Para una demo corta use mejor
# port-forward (ver abajo) y deje el Service en ClusterIP.
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: demo-secretos-svc
spec:
  type: LoadBalancer
  selector:
    app: demo-secretos
  ports:
    - port: 80
      targetPort: 9898

# -------------------------------------------------------------
# CÓMO PROBARLO
# -------------------------------------------------------------
# kubectl apply -f 03-service-lb.yaml
# kubectl get svc demo-secretos-svc -w
#
# # Cuando aparezca la EXTERNAL-IP, abrir en el navegador:
# http://<EXTERNAL-IP>
# El mensaje del Secret aparece en grande, en el centro.
#
# ALTERNATIVA SIN COSTO: cambie type a ClusterIP y use
# kubectl port-forward svc/demo-secretos-svc 8080:80
# # abrir http://localhost:8080
#
# LIMPIEZA (libera el balanceador y deja de facturar)
# kubectl delete -f 03-service-lb.yaml
# -------------------------------------------------------------
