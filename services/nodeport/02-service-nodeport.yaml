# =============================================================
# Service tipo NodePort — Un puerto en CADA nodo
# -------------------------------------------------------------
# Módulo 4 · Sesión 3 · Tipo 2 de 3
#
# Abre el mismo puerto alto en TODOS los nodos del clúster,
# incluso en aquellos donde no hay ningún Pod de la aplicación.
# kube-proxy reenvía el tráfico al nodo correcto.
#
# CLAVE PARA EL EQUIPO DE REDES: ese puerto debe estar abierto
# en el firewall de todos los nodos, no solo de uno. El rango
# permitido es 30000-32767.
#
# Un NodePort incluye también una ClusterIP: los tipos son
# acumulativos.
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      protocol: TCP
      port: 80          # puerto interno del Service
      targetPort: 80    # puerto del contenedor
      nodePort: 30080   # puerto EXTERNO en todos los nodos
                        # si se omite, Kubernetes asigna uno libre

# -------------------------------------------------------------
# CÓMO PROBARLO
# -------------------------------------------------------------
# kubectl apply -f ../00-deployment-nginx.yaml
# kubectl apply -f 02-service-nodeport.yaml
# kubectl get svc nginx-service
#
# # Obtener las IPs de los nodos
# kubectl get nodes -o wide
#
# # Probar contra CADA nodo: todos deben responder
# curl http://<IP-nodo-1>:30080
# curl http://<IP-nodo-2>:30080
# curl http://<IP-nodo-3>:30080
#
# Refresque en el navegador: nginxdemos/hello muestra el nombre
# del Pod, así que verá cambiar el servidor que atiende.
#
# NOTA: este Service se llama igual que el de clusterip/.
# Aplicar uno reemplaza el tipo del otro. Eso es intencional:
# permite ver la transición ClusterIP → NodePort sobre el mismo
# Service, sin crear objetos nuevos.
# -------------------------------------------------------------
