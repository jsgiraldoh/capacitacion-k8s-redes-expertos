# =============================================================
# Deployment que CONSUME el PVC
# -------------------------------------------------------------
# Aquí se ve la pieza final: el Pod no sabe nada del PV ni de
# la infraestructura. Solo nombra un PVC.
#
# Fíjese en los dos bloques que siempre van juntos:
#   volumes       → a nivel del Pod: QUÉ volumen y de dónde sale
#   volumeMounts  → dentro del contenedor: EN QUÉ RUTA aparece
# El campo "name" es lo que los enlaza.
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-persistente
spec:
  replicas: 1
  # IMPORTANTE: con ReadWriteOnce, no suba a 2 o más réplicas.
  # Solo arrancaría el Pod del nodo que tomó el disco; los demás
  # quedarían en Pending. Para varias réplicas con estado se usa
  # un StatefulSet con volumeClaimTemplates.

  selector:
    matchLabels:
      app: web-persistente

  template:
    metadata:
      labels:
        app: web-persistente
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          volumeMounts:
            - name: datos
              mountPath: /usr/share/nginx/html

      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: pvc-demo      # el PVC del archivo anterior

---
apiVersion: v1
kind: Service
metadata:
  name: web-persistente-svc
spec:
  type: ClusterIP
  selector:
    app: web-persistente
  ports:
    - port: 80
      targetPort: 80

# -------------------------------------------------------------
# LA PRUEBA DE PERSISTENCIA (el ejercicio central del módulo)
# -------------------------------------------------------------
# 1) Desplegar
#    kubectl apply -f 03-deployment-con-pvc.yaml
#
# 2) Escribir un dato dentro del volumen
#
#    RECOMENDADO: entrar al contenedor y escribir ahí dentro.
#    Funciona igual desde Windows, Linux y macOS, porque el
#    comando lo interpreta la shell del contenedor y no la de
#    su equipo.
#
#    kubectl exec -it deploy/web-persistente -- sh
#
#    # Ya dentro del contenedor:
#    echo "<h1>Dato guardado el $(date)</h1>" > /usr/share/nginx/html/index.html
#    cat /usr/share/nginx/html/index.html
#    exit
#
#    ---------------------------------------------------------
#    EN UNA SOLA LÍNEA, según su sistema:
#
#    Linux / macOS (bash o zsh):
#    kubectl exec deploy/web-persistente -- \
#      sh -c 'echo "<h1>Dato guardado el $(date)</h1>" > /usr/share/nginx/html/index.html'
#
#    Windows (PowerShell): lo anterior NO funciona.
#    PowerShell elimina las comillas simples antes de pasar los
#    argumentos, así que sh recibe <h1> como un archivo y falla
#    con "cannot open h1: No such file". Use en su lugar:
#
#    kubectl exec deploy/web-persistente -- sh -c "date > /usr/share/nginx/html/index.html"
#
#    O bien --% para que PowerShell no interprete nada:
#    kubectl exec deploy/web-persistente --% -- sh -c 'echo "<h1>Dato</h1>" > /usr/share/nginx/html/index.html'
#    ---------------------------------------------------------
#
# 3) Comprobar que se lee
#    kubectl exec deploy/web-persistente -- cat /usr/share/nginx/html/index.html
#
# 4) BORRAR EL POD (no el Deployment)
#    kubectl delete pod -l app=web-persistente
#
# 5) Esperar al Pod nuevo y volver a leer: EL DATO SIGUE AHÍ
#    kubectl get pods -w
#    kubectl exec deploy/web-persistente -- cat /usr/share/nginx/html/index.html
#
# Compare con el ejemplo de emptyDir: allí el dato se perdió.
# Esa es toda la diferencia entre efímero y persistente.
#
