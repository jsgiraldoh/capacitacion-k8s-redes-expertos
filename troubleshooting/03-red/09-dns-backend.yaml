# =============================================================
# ESCENARIO 09 · DNS entre namespaces (backend)
# -------------------------------------------------------------
# Módulo 9 · Sesión 9
#
# El servicio "api" vive en OTRO namespace (lab-ts-backend).
# Este archivo está sano: se aplica primero.
# =============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab-ts-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab-ts-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lab-ts-backend
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 80
